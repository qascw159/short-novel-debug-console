<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短篇小说调试台</title>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f3;
      --surface: #ffffff;
      --surface-alt: #eef1ed;
      --ink: #1e2422;
      --muted: #68716d;
      --line: #d7ddd8;
      --accent: #087e8b;
      --accent-strong: #006a75;
      --accent-soft: #e4f4f4;
      --amber: #a65f00;
      --amber-soft: #fff3dc;
      --danger: #b83a3a;
      --danger-soft: #fdecec;
      --success: #237a4b;
      --shadow: 0 10px 30px rgba(29, 39, 35, 0.09);
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 0 18px;
      color: #f7faf8;
      background: #202825;
      border-bottom: 1px solid #111714;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #75d4d7;
      border: 1px solid #4d6863;
      border-radius: var(--radius);
    }

    .session-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-left: auto;
      color: #bfc9c5;
      font-size: 12px;
    }

    .session-id {
      overflow: hidden;
      max-width: 220px;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #6d7874;
    }

    .status-dot.live { background: #55c987; box-shadow: 0 0 0 3px rgba(85, 201, 135, .14); }
    .status-dot.busy { background: #f0b24e; box-shadow: 0 0 0 3px rgba(240, 178, 78, .14); }
    .status-dot.error { background: #ef7070; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
    }

    .icon-btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); }
    .icon-btn svg { width: 17px; height: 17px; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
    }

    .experience {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .thread {
      overflow-y: auto;
      padding: 32px max(22px, calc((100% - 820px) / 2));
      scroll-behavior: smooth;
    }

    .empty-state {
      min-height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 8px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state .empty-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius);
    }

    .empty-state h1 { margin: 4px 0 0; color: var(--ink); font-size: 21px; line-height: 1.3; }
    .empty-state p { margin: 0; font-size: 13px; }

    .message {
      width: min(100%, 820px);
      margin: 0 auto 20px;
    }

    .message-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .message-label svg { width: 14px; height: 14px; }

    .user-bubble {
      margin-left: auto;
      width: fit-content;
      max-width: 78%;
      padding: 11px 14px;
      color: #fff;
      background: var(--accent-strong);
      border-radius: var(--radius);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .system-panel {
      padding: 16px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .system-panel.error { color: #7f2222; background: var(--danger-soft); border-color: #efbcbc; }
    .system-panel.notice { color: #6c4300; background: var(--amber-soft); border-color: #ebce96; }

    .card-question { margin: 0 0 5px; font-size: 16px; font-weight: 750; }
    .card-description { margin: 0 0 13px; color: var(--muted); }

    .choices { display: grid; gap: 8px; margin: 12px 0; }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      padding: 10px 11px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .choice:hover { border-color: #94bfc0; }
    .choice input { margin-top: 3px; accent-color: var(--accent); }
    .choice-copy { min-width: 0; }
    .choice-title { display: block; font-weight: 650; overflow-wrap: anywhere; }
    .choice-note { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    .text-input, .prompt-editor, .composer textarea, .feedback-input {
      width: 100%;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
      resize: vertical;
    }

    .text-input, .feedback-input { min-height: 78px; padding: 10px 11px; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(8,126,139,.12); }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 13px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-weight: 700;
    }

    .btn:hover { border-color: #aab4af; background: #f8faf8; }
    .btn.primary { color: white; background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-strong); }
    .btn.danger { color: var(--danger); border-color: #e2bcbc; }
    .btn.danger:hover { background: var(--danger-soft); border-color: #d89999; }
    .btn svg { width: 16px; height: 16px; }

    .outline-title { margin: 0 0 4px; font-size: 18px; }
    .outline-logline { margin: 0 0 16px; color: var(--muted); }

    .beats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .beat {
      min-width: 0;
      padding: 11px;
      background: var(--surface);
      border-left: 3px solid var(--accent);
    }

    .beat-index { color: var(--accent-strong); font-size: 11px; font-weight: 800; }
    .beat h4 { margin: 2px 0 4px; font-size: 14px; }
    .beat p { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

    .novel {
      padding: 5px 2px 24px;
      font-family: "Noto Serif SC", "Songti SC", STSong, serif;
      font-size: 16px;
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .stream-caret::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 1.1em;
      margin-left: 3px;
      vertical-align: -2px;
      background: var(--accent);
      animation: blink 900ms steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .composer-wrap {
      padding: 14px max(22px, calc((100% - 820px) / 2)) 18px;
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
      width: min(100%, 820px);
      margin: auto;
    }

    .composer textarea { min-height: 46px; max-height: 150px; padding: 11px 12px; resize: none; }

    .send-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      align-self: end;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: var(--radius);
    }

    .send-btn:hover { background: var(--accent-strong); }
    .send-btn svg { width: 18px; height: 18px; }

    .settings {
      min-width: 0;
      overflow-y: auto;
      padding: 18px;
      background: #f1f3f0;
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .settings-head h2 { margin: 0; font-size: 15px; }

    .settings-views {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 16px;
      padding: 3px;
      background: #e4e8e4;
      border-radius: var(--radius);
    }

    .settings-view-tab {
      height: 34px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      font-weight: 700;
    }

    .settings-view-tab.active { color: var(--ink); background: var(--surface); box-shadow: 0 1px 3px rgba(31,40,36,.1); }
    .settings-view[hidden] { display: none; }

    .setting-group { padding: 15px 0; border-top: 1px solid var(--line); }
    .setting-group:first-of-type { border-top: 0; padding-top: 0; }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 750;
    }

    .field-help { color: var(--muted); font-size: 11px; font-weight: 500; }

    .field-input, .field-select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; gap: 10px; }
    .token-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; background: #b9c1bd; border-radius: 12px; transition: .18s; }
    .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .18s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }

    .prompt-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 8px;
    }

    .prompt-tab {
      min-width: 0;
      height: 32px;
      padding: 0 6px;
      overflow: hidden;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .prompt-tab:hover { background: #e7ebe7; }
    .prompt-tab.active { color: var(--accent-strong); background: var(--accent-soft); border-color: #b8dada; font-weight: 750; }

    .prompt-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 6px; }
    .prompt-toolbar-actions { display: flex; align-items: center; gap: 5px; }
    .prompt-name { color: var(--muted); font-size: 11px; }
    .prompt-editor { min-height: 310px; padding: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; }

    .event-log {
      max-height: 210px;
      overflow: auto;
      margin: 8px 0 0;
      padding: 10px;
      color: #d8e1dd;
      background: #242c29;
      border-radius: var(--radius);
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    details summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 700; }

    .graph-head, .graph-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .graph-head h3 { margin: 0; font-size: 14px; }
    .graph-user { margin-top: 2px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }

    .graph-toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
    }

    .graph-toolbar .btn { flex: 1; padding-inline: 9px; }
    .graph-toolbar .icon-btn { color: var(--danger); border-color: var(--line); background: var(--surface); }
    .graph-toolbar .icon-btn:hover { background: var(--danger-soft); border-color: #e2bcbc; }

    .graph-resource-pickers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 9px;
    }

    .graph-resource-picker { display: grid; min-width: 0; gap: 5px; }
    .graph-resource-picker .field-label { margin: 0; }
    .graph-resource-picker select { width: 100%; min-width: 0; }

    .graph-stats {
      justify-content: flex-start;
      margin: 14px 0 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .graph-stat strong { color: var(--ink); font-size: 16px; margin-right: 3px; }

    .graph-canvas {
      position: relative;
      width: 100%;
      height: 340px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .graph-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 7px;
      padding: 20px;
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    .graph-empty svg { width: 24px; height: 24px; color: var(--accent); }
    .graph-network { position: absolute; inset: 0; }

    .graph-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .graph-detail-head .field-label { margin: 0; }
    .entity-list, .relation-list { display: grid; gap: 7px; margin-top: 9px; }

    .entity-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 7px 7px 10px;
      background: var(--surface);
      border-left: 3px solid var(--accent);
    }

    .entity-copy { min-width: 0; }
    .entity-title { overflow-wrap: anywhere; font-size: 12px; font-weight: 750; }
    .entity-meta { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .row-actions { display: flex; align-items: center; gap: 2px; }
    .row-actions .icon-btn { width: 30px; height: 30px; color: var(--muted); }
    .row-actions .icon-btn:hover { color: var(--ink); background: var(--surface-alt); }
    .row-actions .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

    .relation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 48px;
      padding: 7px 7px 7px 9px;
      background: var(--surface);
      border-left: 3px solid #d5a13d;
      font-size: 12px;
    }

    .relation-row span { min-width: 0; overflow-wrap: anywhere; }
    .relation-type { color: var(--amber); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .graph-dialog {
      width: min(92vw, 520px);
      max-height: min(88vh, 720px);
      padding: 0;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 24px 70px rgba(18, 28, 24, .24);
    }

    .graph-dialog::backdrop { background: rgba(20, 28, 25, .45); }
    .graph-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
    .graph-dialog-head h3 { margin: 0; font-size: 15px; }
    .graph-dialog-head .icon-btn:hover { color: var(--ink); background: var(--surface-alt); }
    .graph-form { display: grid; gap: 14px; padding: 17px 18px 18px; }
    .graph-form-section { display: grid; gap: 13px; }
    .graph-form-section[hidden] { display: none; }
    .graph-form textarea { min-height: 100px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; resize: vertical; }
    .graph-form-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 3px; }

    .mobile-settings { display: none; }
    .close-settings { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 30;
      max-width: min(90vw, 520px);
      padding: 9px 13px;
      color: white;
      background: #26302c;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: minmax(0, 1fr) 360px; }
      .beats { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      .workspace { display: block; }
      .experience { height: 100%; border-right: 0; }
      .settings {
        position: fixed;
        z-index: 20;
        inset: 54px 0 0 auto;
        width: min(92vw, 420px);
        box-shadow: var(--shadow);
        transform: translateX(105%);
        transition: transform .2s ease;
      }
      .settings.open { transform: translateX(0); }
      .mobile-settings, .close-settings { display: inline-grid; }
      .session-id { max-width: 105px; }
      .thread { padding: 22px 16px; }
      .composer-wrap { padding: 12px 16px 14px; }
      .user-bubble { max-width: 90%; }
    }

    @media (max-width: 520px) {
      .topbar { padding: 0 10px; gap: 8px; }
      .brand span:last-child { display: none; }
      .session-strip .status-text { display: none; }
      .session-id { max-width: 90px; }
      .prompt-editor { min-height: 260px; }
      .graph-resource-pickers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="book-open-text"></i></span>
      <span>短篇小说调试台</span>
    </div>
    <div class="session-strip">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">就绪</span>
      <span id="sessionId" class="session-id">未创建会话</span>
      <button id="copySession" class="icon-btn" title="复制会话 ID" aria-label="复制会话 ID"><i data-lucide="copy"></i></button>
    </div>
    <button id="newSession" class="icon-btn" title="新建会话" aria-label="新建会话"><i data-lucide="rotate-ccw"></i></button>
    <button id="openSettings" class="icon-btn mobile-settings" title="模型与提示词" aria-label="打开模型与提示词"><i data-lucide="sliders-horizontal"></i></button>
  </header>

  <main class="workspace">
    <section class="experience" aria-label="小说生成体验区">
      <div id="thread" class="thread">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon"><i data-lucide="message-square-text"></i></div>
          <h1>今天想写点什么？</h1>
          <p>从一件真实发生的小事开始。</p>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="queryInput" rows="1" placeholder="写下今天发生了什么…" aria-label="用户 query"></textarea>
          <button id="sendQuery" class="send-btn" title="开始" aria-label="开始生成"><i data-lucide="arrow-up"></i></button>
        </div>
      </div>
    </section>

    <aside id="settings" class="settings" aria-label="模型与提示词设置">
      <div class="settings-head">
        <h2>模型与提示词</h2>
        <button id="closeSettings" class="icon-btn close-settings" title="关闭" aria-label="关闭设置"><i data-lucide="x"></i></button>
      </div>

      <div class="settings-views" role="tablist" aria-label="调试视图">
        <button id="configViewTab" class="settings-view-tab active" type="button" role="tab" aria-selected="true">调试配置</button>
        <button id="graphViewTab" class="settings-view-tab" type="button" role="tab" aria-selected="false">用户图谱</button>
      </div>

      <div id="configView" class="settings-view">

      <div class="setting-group">
        <label class="field-label" for="userIdInput">用户 ID <span class="field-help">影响每日限额与用户记忆</span></label>
        <input id="userIdInput" class="field-input" autocomplete="off">

        <label class="field-label" for="modelInput" style="margin-top:13px">模型 <span class="field-help">支持输入自定义 model ID</span></label>
        <input id="modelInput" class="field-input" list="modelOptions" autocomplete="off">
        <datalist id="modelOptions"></datalist>

        <label class="field-label" for="temperatureRange" style="margin-top:13px">Temperature <span id="temperatureValue" class="field-help">0.70</span></label>
        <div class="range-row">
          <input id="temperatureRange" type="range" min="0" max="2" step="0.05" value="0.7">
          <input id="temperatureNumber" class="field-input" type="number" min="0" max="2" step="0.05" value="0.7" aria-label="Temperature 数值">
        </div>

        <div class="toggle-row" style="margin-top:14px">
          <div>
            <div class="field-label" style="margin:0">强制重新生成</div>
            <div class="field-help">忽略当天已有小说</div>
          </div>
          <label class="switch" aria-label="强制重新生成">
            <input id="forceRegenerate" type="checkbox"><span></span>
          </label>
        </div>

        <label class="field-label" for="apiToken" style="margin-top:14px">API Token <span class="field-help">仅保存在当前标签页</span></label>
        <div class="token-row">
          <input id="apiToken" class="field-input" type="password" autocomplete="off" placeholder="未启用时留空">
          <button id="connectToken" class="btn" type="button"><i data-lucide="key-round"></i><span>连接</span></button>
        </div>
      </div>

      <div class="setting-group">
        <div id="promptTabs" class="prompt-tabs"></div>
        <div class="prompt-toolbar">
          <span id="promptName" class="prompt-name"></span>
          <div class="prompt-toolbar-actions">
            <button id="resetPrompt" class="icon-btn" title="恢复当前默认提示词" aria-label="恢复当前默认提示词"><i data-lucide="undo-2"></i></button>
            <button id="saveDefaults" class="btn primary" type="button"><i data-lucide="save"></i><span>保存为系统默认</span></button>
          </div>
        </div>
        <div id="defaultConfigStatus" class="field-help" style="margin-bottom:7px"></div>
        <textarea id="promptEditor" class="prompt-editor" spellcheck="false" aria-label="系统提示词编辑器"></textarea>
      </div>

      <div class="setting-group">
        <details>
          <summary>原始 SSE 事件</summary>
          <pre id="eventLog" class="event-log">等待请求…</pre>
        </details>
      </div>
      </div>

      <div id="graphView" class="settings-view" hidden>
        <div class="graph-head">
          <div>
            <h3>用户知识图谱</h3>
            <div id="graphUser" class="graph-user"></div>
          </div>
          <button id="refreshGraph" class="icon-btn" title="刷新用户图谱" aria-label="刷新用户图谱"><i data-lucide="refresh-cw"></i></button>
        </div>
        <div class="graph-toolbar">
          <button id="addGraphNode" class="btn primary" type="button"><i data-lucide="circle-plus"></i><span>新增节点</span></button>
          <button id="addGraphEdge" class="btn" type="button"><i data-lucide="git-branch-plus"></i><span>新增关系</span></button>
          <button id="clearGraph" class="icon-btn" type="button" title="清空整个图谱" aria-label="清空整个图谱"><i data-lucide="trash-2"></i></button>
        </div>
        <div class="graph-resource-pickers">
          <label class="graph-resource-picker">
            <span class="field-label">选择节点</span>
            <select id="graphNodePicker" class="field-select" aria-label="选择已有节点或新建节点"></select>
          </label>
          <label class="graph-resource-picker">
            <span class="field-label">选择关系</span>
            <select id="graphEdgePicker" class="field-select" aria-label="选择已有关系或新建关系"></select>
          </label>
        </div>
        <div class="graph-stats">
          <span class="graph-stat"><strong id="nodeCount">0</strong>节点</span>
          <span class="graph-stat"><strong id="edgeCount">0</strong>关系</span>
          <span id="graphStatus" class="field-help">尚未加载</span>
        </div>
        <div id="graphCanvas" class="graph-canvas">
          <div id="graphNetwork" class="graph-network"></div>
          <div id="graphEmpty" class="graph-empty">
            <i data-lucide="share-2"></i>
            <span>输入 API Token 后加载当前用户图谱</span>
          </div>
        </div>
        <div class="graph-detail-head">
          <div class="field-label">节点明细</div>
        </div>
        <div id="nodeList" class="entity-list"></div>
        <div class="graph-detail-head">
          <div class="field-label">关系明细</div>
        </div>
        <div id="relationList" class="relation-list"></div>
      </div>
    </aside>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<dialog id="graphEditorDialog" class="graph-dialog" aria-labelledby="graphEditorTitle">
  <div class="graph-dialog-head">
    <h3 id="graphEditorTitle">新增节点</h3>
    <button id="closeGraphEditor" class="icon-btn" type="button" title="关闭" aria-label="关闭编辑器"><i data-lucide="x"></i></button>
  </div>
  <form id="graphEditorForm" class="graph-form">
    <div id="nodeEditorFields" class="graph-form-section">
      <div>
        <label class="field-label" for="graphNodeName">名称</label>
        <input id="graphNodeName" class="field-input" maxlength="255" autocomplete="off" required>
      </div>
      <div>
        <label class="field-label" for="graphNodeType">类型</label>
        <input id="graphNodeType" class="field-input" list="graphNodeTypes" maxlength="32" autocomplete="off" required>
        <datalist id="graphNodeTypes">
          <option value="person"></option><option value="organization"></option><option value="location"></option>
          <option value="event"></option><option value="concept"></option><option value="emotion"></option>
        </datalist>
      </div>
      <div>
        <label class="field-label" for="graphNodeConfidence">置信度</label>
        <input id="graphNodeConfidence" class="field-input" type="number" min="0" max="1" step="0.01" required>
      </div>
      <div>
        <label class="field-label" for="graphNodeProperties">属性 JSON</label>
        <textarea id="graphNodeProperties" aria-label="节点属性 JSON" spellcheck="false"></textarea>
      </div>
    </div>
    <div id="edgeEditorFields" class="graph-form-section" hidden>
      <div>
        <label class="field-label" for="graphEdgeSource">源节点</label>
        <select id="graphEdgeSource" class="field-select"></select>
      </div>
      <div>
        <label class="field-label" for="graphEdgeRelation">关系类型</label>
        <input id="graphEdgeRelation" class="field-input" list="graphRelationTypes" maxlength="64" autocomplete="off" required>
        <datalist id="graphRelationTypes"></datalist>
      </div>
      <div>
        <label class="field-label" for="graphEdgeTarget">目标节点</label>
        <select id="graphEdgeTarget" class="field-select"></select>
      </div>
      <div>
        <label class="field-label" for="graphEdgeConfidence">置信度</label>
        <input id="graphEdgeConfidence" class="field-input" type="number" min="0" max="1" step="0.01" required>
      </div>
      <div>
        <label class="field-label" for="graphEdgeProperties">属性 JSON</label>
        <textarea id="graphEdgeProperties" aria-label="关系属性 JSON" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="graph-form-actions">
      <button id="cancelGraphEditor" class="btn" type="button">取消</button>
      <button id="saveGraphEditor" class="btn primary" type="submit"><i data-lucide="save"></i><span>保存</span></button>
    </div>
  </form>
</dialog>

<script>
  const API_BASE = '/api/novels/daily/conversation';
  const GRAPH_API_BASE = '/api/novels/knowledge-graph';
  const DEFAULT_NODE_TYPES = ['person', 'organization', 'location', 'event', 'concept', 'emotion'];
  const DEFAULT_RELATION_TYPES = [
    'related_to', 'family_of', 'friend_of', 'colleague_of', 'works_at',
    'lives_in', 'caused_by', 'involves', 'feels'
  ];
  const PROMPT_LABELS = {
    clarification_system: '澄清判断',
    outline_system: '生成大纲',
    outline_modify_system: '修改大纲',
    novel_system: '小说正文',
    profile_system: '用户画像',
    graph_system: '知识图谱'
  };

  // 页面状态只保存调试会话和临时 UI 数据；API Token 刻意不进入 localStorage。
  const state = {
    sessionId: '',
    userId: localStorage.getItem('novel_debug_user_id') || `debug_${Date.now().toString(36)}`,
    busy: false,
    prompts: {},
    defaults: {},
    activePrompt: 'clarification_system',
    novelNode: null,
    novelText: '',
    eventLines: [],
    graphNetwork: null,
    graphData: { nodes: [], edges: [] },
    graphEditorKind: 'node',
    graphEditingId: null,
    memoryPollTimer: null,
    configPersisted: false,
    configUpdatedAt: null
  };
  localStorage.setItem('novel_debug_user_id', state.userId);

  const $ = (id) => document.getElementById(id);
  const el = {
    thread: $('thread'), empty: $('emptyState'), query: $('queryInput'), send: $('sendQuery'),
    statusDot: $('statusDot'), statusText: $('statusText'), sessionId: $('sessionId'),
    model: $('modelInput'), models: $('modelOptions'), tempRange: $('temperatureRange'),
    tempNumber: $('temperatureNumber'), tempValue: $('temperatureValue'), force: $('forceRegenerate'),
    apiToken: $('apiToken'), tabs: $('promptTabs'), promptName: $('promptName'), prompt: $('promptEditor'),
    eventLog: $('eventLog'), settings: $('settings'), toast: $('toast'),
    configView: $('configView'), graphView: $('graphView'), graphUser: $('graphUser'),
    graphStatus: $('graphStatus'), graphCanvas: $('graphCanvas'), graphNetwork: $('graphNetwork'), graphEmpty: $('graphEmpty'),
    nodeList: $('nodeList'), relationList: $('relationList'), nodeCount: $('nodeCount'), edgeCount: $('edgeCount'),
    graphNodePicker: $('graphNodePicker'), graphEdgePicker: $('graphEdgePicker'),
    graphDialog: $('graphEditorDialog'), graphForm: $('graphEditorForm')
  };
  el.userId = $('userIdInput');
  el.userId.value = state.userId;

  function refreshIcons() {
    if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
  }

  function apiHeaders(accept = 'application/json') {
    const headers = { 'Content-Type': 'application/json', 'Accept': accept };
    const token = el.apiToken.value.trim();
    if (token) headers['X-API-Token'] = token;
    return headers;
  }

  // ---------- 运行配置与提示词快照 ----------

  async function loadConfig() {
    try {
      const response = await fetch(`${API_BASE}/debug-config`, { headers: apiHeaders('application/json') });
      if (!response.ok) throw new Error(response.status === 401 ? '需要填写 API Token' : `配置加载失败 (${response.status})`);
      const config = await response.json();
      state.defaults = config.prompts || {};
      state.prompts = { ...state.defaults };
      state.configPersisted = Boolean(config.persisted);
      state.configUpdatedAt = config.updated_at || null;
      el.model.value = config.default_model || 'deepseek-v4-flash';
      const temperature = Number(config.default_temperature ?? 0.7);
      setTemperature(temperature);
      el.models.innerHTML = '';
      (config.model_suggestions || []).forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        el.models.appendChild(option);
      });
      renderPromptTabs();
      renderDefaultConfigStatus();
    } catch (error) {
      showToast(error.message);
      state.defaults = Object.fromEntries(Object.keys(PROMPT_LABELS).map(key => [key, '']));
      state.prompts = { ...state.defaults };
      renderPromptTabs();
    }
  }

  function renderDefaultConfigStatus() {
    const status = $('defaultConfigStatus');
    if (!state.configPersisted) {
      status.textContent = '当前使用代码内置默认值';
      return;
    }
    const savedAt = state.configUpdatedAt ? new Date(state.configUpdatedAt).toLocaleString('zh-CN') : '';
    status.textContent = savedAt ? `系统默认已持久化 · ${savedAt}` : '系统默认已持久化';
  }

  async function saveSystemDefaults() {
    const token = el.apiToken.value.trim();
    if (!token) return showToast('保存系统默认需要 API Token');
    state.prompts[state.activePrompt] = el.prompt.value;
    const button = $('saveDefaults');
    button.disabled = true;
    try {
      const response = await fetch(`${API_BASE}/debug-config`, {
        method: 'PUT',
        headers: apiHeaders('application/json'),
        body: JSON.stringify({
          default_model: el.model.value.trim() || 'deepseek-v4-flash',
          default_temperature: Number(el.tempNumber.value),
          prompts: state.prompts
        })
      });
      if (!response.ok) {
        const message = await response.text();
        throw new Error(response.status === 401 ? 'API Token 不正确' : `保存失败 (${response.status}) ${message}`);
      }
      const config = await response.json();
      state.defaults = { ...config.prompts };
      state.prompts = { ...config.prompts };
      state.configPersisted = true;
      state.configUpdatedAt = config.updated_at;
      el.model.value = config.default_model;
      setTemperature(config.default_temperature);
      renderPromptTabs();
      renderDefaultConfigStatus();
      showToast('已保存为系统默认');
    } catch (error) {
      showToast(error.message);
    } finally {
      button.disabled = false;
      refreshIcons();
    }
  }

  async function connectDebug() {
    await loadConfig();
    if (el.apiToken.value.trim()) await loadGraph();
  }

  function switchSettingsView(view) {
    const isGraph = view === 'graph';
    el.configView.hidden = isGraph;
    el.graphView.hidden = !isGraph;
    $('configViewTab').classList.toggle('active', !isGraph);
    $('graphViewTab').classList.toggle('active', isGraph);
    $('configViewTab').setAttribute('aria-selected', String(!isGraph));
    $('graphViewTab').setAttribute('aria-selected', String(isGraph));
    if (isGraph) loadGraph();
  }

  // ---------- 知识图谱可视化与 CRUD 编辑器 ----------

  async function loadGraph() {
    const userId = el.userId.value.trim();
    el.graphUser.textContent = userId || '未指定用户';
    if (!userId) return renderGraph({ nodes: [], edges: [] }, '用户 ID 不能为空');
    if (!el.apiToken.value.trim()) return renderGraph({ nodes: [], edges: [] }, '需要 API Token');

    el.graphStatus.textContent = '加载中';
    try {
      const response = await fetch(`${GRAPH_API_BASE}/${encodeURIComponent(userId)}`, {
        headers: apiHeaders('application/json')
      });
      if (!response.ok) throw new Error(response.status === 401 ? 'API Token 不正确' : `图谱加载失败 (${response.status})`);
      renderGraph(await response.json(), '已更新');
    } catch (error) {
      renderGraph({ nodes: [], edges: [] }, error.message);
    }
  }

  function renderGraph(data, status) {
    const rawNodes = Array.isArray(data.nodes) ? data.nodes : [];
    const rawEdges = Array.isArray(data.edges) ? data.edges : [];
    // 保留 API 原始记录：record_id 用于 REST 路径，id 才是关系端点使用的图内部 ID。
    state.graphData = { nodes: rawNodes, edges: rawEdges };
    const nodeMap = new Map(rawNodes.map(node => [node.id, node]));
    rawEdges.forEach(edge => {
      if (!nodeMap.has(edge.source)) nodeMap.set(edge.source, inferredNode(edge.source, edge.source_type));
      if (!nodeMap.has(edge.target)) nodeMap.set(edge.target, inferredNode(edge.target, edge.target_type));
    });
    const nodes = [...nodeMap.values()];
    renderGraphResourcePickers(rawNodes, rawEdges, nodeMap);
    renderGraphTypeSuggestions(rawNodes, rawEdges);

    el.nodeCount.textContent = String(nodes.length);
    el.edgeCount.textContent = String(rawEdges.length);
    el.graphStatus.textContent = status;
    $('addGraphEdge').disabled = rawNodes.length < 2;
    $('clearGraph').disabled = rawNodes.length === 0 && rawEdges.length === 0;
    el.graphEmpty.style.display = nodes.length ? 'none' : 'grid';
    el.graphEmpty.querySelector('span').textContent = status === '已更新'
      ? '当前用户还没有图谱数据' : status;

    if (state.graphNetwork) {
      state.graphNetwork.destroy();
      state.graphNetwork = null;
    }
    if (nodes.length && window.vis && window.vis.Network) {
      const palette = {
        person: { background: '#dff3f3', border: '#087e8b' },
        event: { background: '#fff0d2', border: '#a65f00' },
        emotion: { background: '#f7e5ee', border: '#a94d79' },
        organization: { background: '#e6ebf6', border: '#506c9b' },
        location: { background: '#e6f2df', border: '#568044' },
        concept: { background: '#eee8f6', border: '#735394' }
      };
      const graphNodes = nodes.map(node => ({
        id: node.id,
        label: node.name || entityLabel(node.id),
        title: `${node.type || 'concept'} · ${Math.round((node.confidence || 0) * 100)}%`,
        color: palette[node.type] || palette.concept,
        borderWidth: node.name === '用户' ? 3 : 1.5,
        size: node.name === '用户' ? 24 : 18
      }));
      const graphEdges = rawEdges.map((edge, index) => ({
        id: edge.id == null ? `edge_${index}` : `edge_${edge.id}`,
        from: edge.source,
        to: edge.target,
        label: edge.relation || 'related_to',
        arrows: 'to'
      }));
      state.graphNetwork = new vis.Network(el.graphNetwork, {
        nodes: new vis.DataSet(graphNodes), edges: new vis.DataSet(graphEdges)
      }, {
        autoResize: true,
        nodes: { shape: 'dot', font: { size: 12, color: '#1e2422' } },
        edges: { color: '#9aa8a2', font: { size: 9, color: '#68716d', background: '#ffffff' }, smooth: { type: 'dynamic' } },
        interaction: { hover: true, tooltipDelay: 120 },
        physics: { stabilization: { iterations: 120 }, barnesHut: { gravitationalConstant: -2600, springLength: 110 } }
      });
      state.graphNetwork.once('stabilizationIterationsDone', () => {
        state.graphNetwork.fit({ animation: false });
      });
    }

    renderNodeList(rawNodes);
    el.relationList.innerHTML = '';
    rawEdges.slice(0, 30).forEach(edge => {
      const row = document.createElement('div');
      row.className = 'relation-row';
      const source = document.createElement('span');
      source.textContent = nodeMap.get(edge.source)?.name || entityLabel(edge.source);
      const relation = document.createElement('span');
      relation.className = 'relation-type';
      relation.textContent = edge.relation || 'related_to';
      const target = document.createElement('span');
      target.textContent = nodeMap.get(edge.target)?.name || entityLabel(edge.target);
      const actions = rowActions(
        () => openEdgeEditor(edge),
        () => deleteGraphEdge(edge)
      );
      row.append(source, relation, target, actions);
      el.relationList.appendChild(row);
    });
    refreshIcons();
  }

  function renderGraphResourcePickers(nodes, edges, nodeMap) {
    populateGraphResourcePicker(
      el.graphNodePicker,
      '选择已有节点或新建',
      '自定义新节点',
      nodes,
      node => String(node.record_id),
      node => `${node.name || entityLabel(node.id)} (${node.type || 'concept'})`
    );
    populateGraphResourcePicker(
      el.graphEdgePicker,
      '选择已有关系或新建',
      '自定义新关系',
      edges,
      edge => String(edge.id),
      edge => {
        const source = nodeMap.get(edge.source)?.name || entityLabel(edge.source);
        const target = nodeMap.get(edge.target)?.name || entityLabel(edge.target);
        return `${source} - ${edge.relation || 'related_to'} -> ${target}`;
      }
    );
    el.graphEdgePicker.disabled = nodes.length < 2;
  }

  function populateGraphResourcePicker(select, placeholderLabel, newLabel, items, valueOf, labelOf) {
    select.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = placeholderLabel;
    placeholder.selected = true;
    placeholder.disabled = true;
    select.appendChild(placeholder);

    const create = document.createElement('option');
    create.value = '__new__';
    create.textContent = `+ ${newLabel}`;
    select.appendChild(create);

    items.forEach(item => {
      const option = document.createElement('option');
      option.value = valueOf(item);
      option.textContent = labelOf(item);
      select.appendChild(option);
    });
  }

  function renderGraphTypeSuggestions(nodes, edges) {
    populateDatalist('graphNodeTypes', [
      ...DEFAULT_NODE_TYPES,
      ...nodes.map(node => node.type)
    ]);
    populateDatalist('graphRelationTypes', [
      ...DEFAULT_RELATION_TYPES,
      ...edges.map(edge => edge.relation)
    ]);
  }

  function populateDatalist(id, values) {
    const datalist = $(id);
    datalist.innerHTML = '';
    [...new Set(values.filter(value => typeof value === 'string' && value.trim()).map(value => value.trim()))]
      .forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        datalist.appendChild(option);
      });
  }

  function editSelectedGraphNode() {
    const value = el.graphNodePicker.value;
    el.graphNodePicker.value = '';
    if (value === '__new__') return openNodeEditor();
    const node = state.graphData.nodes.find(item => String(item.record_id) === value);
    if (node) openNodeEditor(node);
  }

  function editSelectedGraphEdge() {
    const value = el.graphEdgePicker.value;
    el.graphEdgePicker.value = '';
    if (value === '__new__') return openEdgeEditor();
    const edge = state.graphData.edges.find(item => String(item.id) === value);
    if (edge) openEdgeEditor(edge);
  }

  function renderNodeList(nodes) {
    el.nodeList.innerHTML = '';
    nodes.slice(0, 50).forEach(node => {
      const row = document.createElement('div');
      row.className = 'entity-row';
      const copy = document.createElement('div');
      copy.className = 'entity-copy';
      const title = document.createElement('div');
      title.className = 'entity-title';
      title.textContent = node.name || entityLabel(node.id);
      const meta = document.createElement('div');
      meta.className = 'entity-meta';
      meta.textContent = `${node.type || 'concept'} · ${node.provenance || 'ai'}`;
      copy.append(title, meta);
      row.append(copy, rowActions(
        () => openNodeEditor(node),
        () => deleteGraphNode(node)
      ));
      el.nodeList.appendChild(row);
    });
  }

  function rowActions(onEdit, onDelete) {
    const actions = document.createElement('div');
    actions.className = 'row-actions';
    actions.append(
      iconButton('pencil', '编辑', onEdit),
      iconButton('trash-2', '删除', onDelete, true)
    );
    return actions;
  }

  function iconButton(icon, label, handler, danger = false) {
    const control = document.createElement('button');
    control.className = `icon-btn${danger ? ' danger' : ''}`;
    control.type = 'button';
    control.title = label;
    control.setAttribute('aria-label', label);
    control.innerHTML = `<i data-lucide="${icon}"></i>`;
    control.addEventListener('click', handler);
    return control;
  }

  function graphContext() {
    const userId = el.userId.value.trim();
    if (!userId) {
      showToast('用户 ID 不能为空');
      return null;
    }
    if (!el.apiToken.value.trim()) {
      showToast('维护图谱需要 API Token');
      return null;
    }
    return {
      userId,
      base: `${GRAPH_API_BASE}/${encodeURIComponent(userId)}`
    };
  }

  async function graphRequest(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: apiHeaders('application/json')
    });
    if (!response.ok) {
      let message = `请求失败 (${response.status})`;
      try {
        const error = await response.json();
        const details = error.error || Object.values(error).join('；');
        if (details) message = details;
      } catch (_) {
        if (response.status === 401) message = 'API Token 不正确';
      }
      throw new Error(message);
    }
    return response.status === 204 ? null : response.json();
  }

  function openNodeEditor(node = null) {
    if (!graphContext()) return;
    state.graphEditorKind = 'node';
    state.graphEditingId = node?.record_id || null;
    $('graphEditorTitle').textContent = node ? '编辑节点' : '新增节点';
    setGraphEditorKind('node');
    $('graphNodeName').value = node?.name || '';
    $('graphNodeType').value = node?.type || 'person';
    $('graphNodeConfidence').value = Number(node?.confidence ?? 1).toFixed(2);
    $('graphNodeProperties').value = formatProperties(node?.properties);
    el.graphDialog.showModal();
    $('graphNodeName').focus();
    refreshIcons();
  }

  function openEdgeEditor(edge = null) {
    if (!graphContext()) return;
    if (state.graphData.nodes.length < 2) {
      showToast('至少需要两个节点才能创建关系');
      return;
    }
    state.graphEditorKind = 'edge';
    state.graphEditingId = edge?.id ?? null;
    $('graphEditorTitle').textContent = edge ? '编辑关系' : '新增关系';
    setGraphEditorKind('edge');
    populateNodeSelect($('graphEdgeSource'), edge?.source || state.graphData.nodes[0].id);
    populateNodeSelect($('graphEdgeTarget'), edge?.target || state.graphData.nodes[1].id);
    $('graphEdgeRelation').value = edge?.relation || 'related_to';
    $('graphEdgeConfidence').value = Number(edge?.confidence ?? 1).toFixed(2);
    $('graphEdgeProperties').value = formatProperties(edge?.properties);
    el.graphDialog.showModal();
    $('graphEdgeRelation').focus();
    refreshIcons();
  }

  function setGraphEditorKind(kind) {
    const nodeFields = $('nodeEditorFields');
    const edgeFields = $('edgeEditorFields');
    const isNode = kind === 'node';
    nodeFields.hidden = !isNode;
    edgeFields.hidden = isNode;
    // 隐藏的 required 字段仍会参与浏览器校验，切换编辑类型时必须同时禁用非活动字段。
    nodeFields.querySelectorAll('input, textarea, select').forEach(field => { field.disabled = !isNode; });
    edgeFields.querySelectorAll('input, textarea, select').forEach(field => { field.disabled = isNode; });
  }

  function populateNodeSelect(select, selectedId) {
    // 关系端点只能提交当前用户已有的图内部 ID，自由输入会产生悬空引用。
    select.innerHTML = '';
    state.graphData.nodes.forEach(node => {
      const option = document.createElement('option');
      option.value = node.id;
      option.textContent = `${node.name || entityLabel(node.id)} (${node.type || 'concept'})`;
      option.selected = node.id === selectedId;
      select.appendChild(option);
    });
  }

  function formatProperties(properties) {
    return JSON.stringify(properties && typeof properties === 'object' ? properties : {}, null, 2);
  }

  function parseProperties(value) {
    const parsed = value.trim() ? JSON.parse(value) : {};
    if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
      throw new Error('属性必须是 JSON 对象');
    }
    return parsed;
  }

  function closeGraphEditor() {
    if (el.graphDialog.open) el.graphDialog.close();
    state.graphEditingId = null;
  }

  async function saveGraphEditor(event) {
    event.preventDefault();
    const context = graphContext();
    if (!context) return;
    const save = $('saveGraphEditor');
    save.disabled = true;
    try {
      const editing = state.graphEditingId != null;
      let payload;
      let resource;
      if (state.graphEditorKind === 'node') {
        payload = {
          name: $('graphNodeName').value.trim(),
          type: $('graphNodeType').value.trim(),
          confidence: Number($('graphNodeConfidence').value),
          properties: parseProperties($('graphNodeProperties').value)
        };
        resource = editing
          ? `${context.base}/nodes/${encodeURIComponent(state.graphEditingId)}`
          : `${context.base}/nodes`;
      } else {
        payload = {
          source: $('graphEdgeSource').value,
          target: $('graphEdgeTarget').value,
          relation: $('graphEdgeRelation').value.trim(),
          confidence: Number($('graphEdgeConfidence').value),
          properties: parseProperties($('graphEdgeProperties').value)
        };
        resource = editing
          ? `${context.base}/edges/${encodeURIComponent(state.graphEditingId)}`
          : `${context.base}/edges`;
      }
      await graphRequest(resource, {
        method: editing ? 'PUT' : 'POST',
        body: JSON.stringify(payload)
      });
      closeGraphEditor();
      await loadGraph();
      showToast(editing ? '图谱已更新' : '图谱已新增');
    } catch (error) {
      showToast(error instanceof SyntaxError ? '属性 JSON 格式不正确' : error.message);
    } finally {
      save.disabled = false;
      refreshIcons();
    }
  }

  async function deleteGraphNode(node) {
    const context = graphContext();

      await graphRequest(`${context.base}/nodes/${encodeURIComponent(node.record_id)}`, { method: 'DELETE' });
      await loadGraph();
      showToast('节点及关联关系已删除');
    } catch (error) {
      showToast(error.message);
    }

  async function deleteGraphEdge(edge) {

    if (!context) return;
    if (!confirm(`删除关系“${edge.relation || 'related_to'}”？`)) return;
    try {
      await graphRequest(`${context.base}/edges/${encodeURIComponent(edge.id)}`, { method: 'DELETE' });
      await loadGraph();

  async function clearUserGraph() {
    const context = graphContext();
    if (!context) return;
    if (!confirm(`清空用户 ${context.userId} 的全部图谱数据？`)) return;
    try {
      await graphRequest(context.base, { method: 'DELETE' });

  function inferredNode(id, type) {
    return { id, name: entityLabel(id), type: type || 'concept', confidence: 0 };
  }

  function entityLabel(id) {
    if (!id) return '未知实体';
    const parts = String(id).split(':');
    return parts[parts.length - 1];
  }

  async function pollMemoryAndGraph(attempt = 0) {
    // 画像和图谱在大纲生成后异步更新；到达终态或轮询约 36 秒后停止。
    clearTimeout(state.memoryPollTimer);
    if (!state.sessionId || !el.apiToken.value.trim() || attempt >= 12) return;
    try {
      const response = await fetch(`${API_BASE}/sessions/${encodeURIComponent(state.sessionId)}?user_id=${encodeURIComponent(state.userId)}`, {
        headers: apiHeaders('application/json')
      });
      if (response.ok) {
        const session = await response.json();
        if (session.memory_update_status === 'COMPLETED' || session.memory_update_status === 'FAILED') {
          await loadGraph();
          return;
        }
      }
    } catch (_) {
      return;
    }
    state.memoryPollTimer = setTimeout(() => pollMemoryAndGraph(attempt + 1), 3000);
  }

    el.query.disabled = busy || Boolean(state.sessionId);

  }

  function setSession(sessionId) {
    if (!sessionId) return;
    state.sessionId = sessionId;
    el.sessionId.textContent = sessionId;

    el.query.disabled = true;

  function resetSession() {
    clearTimeout(state.memoryPollTimer);
    state.sessionId = '';
    state.novelNode = null;
    state.novelText = '';
    state.eventLines = [];
    el.eventLog.textContent = '等待请求…';
    el.thread.innerHTML = '';
    el.thread.appendChild(el.empty);
    el.empty.style.display = 'grid';
    el.query.disabled = false;

  function lockDebugConfig() {
    state.prompts[state.activePrompt] = el.prompt.value;
    el.userId.disabled = true;
    el.model.disabled = true;
    el.tempRange.disabled = true;
    el.tempNumber.disabled = true;

  // ---------- 会话渲染与 SSE 传输 ----------

  function appendMessage(role, content) {
    el.empty.style.display = 'none';
    const wrapper = document.createElement('article');
    wrapper.className = 'message';
    const label = document.createElement('div');
    label.className = 'message-label';
    label.innerHTML = role === 'user'
      ? '<i data-lucide="user-round"></i><span>你</span>'
      : '<i data-lucide="sparkles"></i><span>生成助手</span>';
    wrapper.appendChild(label);
    const body = document.createElement('div');
    body.className = role === 'user' ? 'user-bubble' : 'system-panel';
    if (typeof content === 'string') body.textContent = content;
    else body.appendChild(content);
    wrapper.appendChild(body);
    el.thread.appendChild(wrapper);
    refreshIcons();
    scrollBottom();
    return body;
  }

  function scrollBottom() {
    requestAnimationFrame(() => { el.thread.scrollTop = el.thread.scrollHeight; });
  }

  function showToast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 2200);
  }

  function logEvent(event) {
    state.eventLines.push(JSON.stringify(event, null, 2));
    if (state.eventLines.length > 80) state.eventLines.shift();
    el.eventLog.textContent = state.eventLines.join('\n\n');
    el.eventLog.scrollTop = el.eventLog.scrollHeight;
  }

  async function streamRequest(body) {
    setBusy(true, '请求中');
    const eventCountBefore = state.eventLines.length;
    try {
      const response = await fetch(`${API_BASE}/stream`, {
        method: 'POST', headers: apiHeaders('text/event-stream'), body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(response.status === 401 ? 'API Token 不正确' : `接口返回 ${response.status}`);
      if (!response.body) throw new Error('浏览器不支持流式响应');

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        // 网络分片可能截断在一个 SSE 事件中间，未完成的尾部必须留给下一次读取。
        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || '';
        for (const block of blocks) parseSseBlock(block);
        if (done) break;
      }
      if (buffer.trim()) parseSseBlock(buffer);
      if (state.eventLines.length === eventCountBefore) throw new Error('接口没有返回 SSE 事件');
    } catch (error) {
      setErrorStatus();
      appendError(error.message);
    } finally {
      state.busy = false;
    }
  }

  function parseSseBlock(block) {
    const data = block.split(/\r?\n/)
      .filter(line => line.startsWith('data:'))
      .map(line => line.slice(5).trimStart())
      .join('\n');
    if (!data || data === '[DONE]') return;
    try { handleEvent(JSON.parse(data)); }
    catch (error) { logEvent({ type: 'parse_error', raw: data, message: error.message }); }
  }

  function handleEvent(event) {
    // type 是公开渲染契约，每种 payload 只由对应的渲染函数解释。
    logEvent(event);
    setSession(event.session_id);
    const payload = event.payload || {};
    switch (event.type) {
      case 'status': setBusy(true, payload.message || payload.stage || '处理中'); break;
      case 'clarification_card': renderClarification(payload.card || {}); break;
      case 'outline_created': renderOutline(payload.outline || {}); pollMemoryAndGraph(); break;
      case 'novel_start': startNovel(payload); break;
      case 'novel_delta': appendNovel(payload.delta || ''); break;
      case 'novel_done': finishNovel(payload); break;
      case 'error': renderApiError(payload); break;
      default: showToast(`收到事件：${event.type}`);
    }
  }

  function renderClarification(card) {
    setBusy(false, `等待澄清 ${card.round || ''}/${card.max_rounds || ''}`);
    const content = document.createElement('div');
    const question = document.createElement('h3');
    question.className = 'card-question';
    question.textContent = card.question || '请补充一些信息';
    content.appendChild(question);
    if (card.description) {
      const description = document.createElement('p');
      description.className = 'card-description';
      description.textContent = card.description;
      content.appendChild(description);
    }

    const form = document.createElement('form');
    const choiceBox = document.createElement('div');
    choiceBox.className = 'choices';
    const isMultiple = card.card_type === 'multi_select' || card.card_type === 'mixed';
    const inputType = isMultiple ? 'checkbox' : 'radio';
    const optionCount = Array.isArray(card.options) ? card.options.length : 0;
    const minSelections = isMultiple
      ? Math.max(0, Math.min(optionCount, Number(card.min_selections ?? 1)))
      : 0;
    const maxSelections = isMultiple
      ? Math.max(1, Math.min(optionCount, Number(card.max_selections ?? optionCount)))
      : 1;
    if (['single_select', 'multi_select', 'mixed'].includes(card.card_type)) {
      (card.options || []).forEach(option => {
        const label = document.createElement('label');
        label.className = 'choice';
        const input = document.createElement('input');
        input.type = inputType;
        input.name = 'clarification-choice';
        input.value = option.value ?? option.label;
        const copy = document.createElement('span');
        copy.className = 'choice-copy';
        const title = document.createElement('span');
        title.className = 'choice-title';
        title.textContent = option.label ?? option.value;
        copy.appendChild(title);
        if (option.description) {
          const note = document.createElement('span');
          note.className = 'choice-note';
          note.textContent = option.description;
          copy.appendChild(note);
        }
        label.append(input, copy);
        choiceBox.appendChild(label);
      });
      form.appendChild(choiceBox);
    }

    let customInput = null;
    if (card.card_type === 'text_input' || card.card_type === 'mixed' || card.allow_custom) {
      customInput = document.createElement('textarea');
      customInput.className = 'text-input';
      customInput.placeholder = card.input_placeholder || '也可以直接输入你的回答';
      form.appendChild(customInput);
    }

    function updateSelectionLimits() {
      if (!isMultiple) return;
      const inputs = [...choiceBox.querySelectorAll('input[type="checkbox"]')];
      const selectedCount = inputs.filter(input => input.checked).length
        + (customInput && customInput.value.trim() ? 1 : 0);
      inputs.forEach(input => {
        if (!input.checked) input.disabled = selectedCount >= maxSelections;
      });
    }
    choiceBox.addEventListener('change', updateSelectionLimits);
    if (customInput) customInput.addEventListener('input', updateSelectionLimits);

    const actions = document.createElement('div');
    actions.className = 'panel-actions';
    const submit = button('提交回答', 'send', true);
    actions.appendChild(submit);
    form.appendChild(actions);
    form.addEventListener('submit', event => {
      event.preventDefault();
      const checked = [...form.querySelectorAll('input:checked')].map(input => input.value);
      const custom = customInput ? customInput.value.trim() : '';
      const selectionCount = checked.length + (custom ? 1 : 0);
      let answer;
      if (card.card_type === 'multi_select' || card.card_type === 'mixed') {
        answer = { selections: checked, custom_text: custom };
        if (selectionCount < minSelections) return showToast(`至少选择或填写 ${minSelections} 项`);
        if (selectionCount > maxSelections) return showToast(`最多选择或填写 ${maxSelections} 项`);
      } else if (card.card_type === 'single_select') {
        answer = custom || checked[0];
        if (!answer) return showToast('请选择或填写回答');
      } else {
        answer = custom;
        if (!answer) return showToast('请填写回答');
      }
      form.querySelectorAll('input, textarea, button').forEach(node => node.disabled = true);
      appendMessage('user', typeof answer === 'string' ? answer : [...checked, custom].filter(Boolean).join('、'));
      streamRequest(sessionBody('answer_clarification', { answer }));
    });
    content.appendChild(form);
    appendMessage('assistant', content);
  }

  function renderOutline(outline) {
    setBusy(false, '等待确认大纲');
    const content = document.createElement('div');
    const title = document.createElement('h3');
    title.className = 'outline-title';
    title.textContent = outline.title || '待确认大纲';
    content.appendChild(title);
    if (outline.logline) {
      const logline = document.createElement('p');
      logline.className = 'outline-logline';
      logline.textContent = outline.logline;
      content.appendChild(logline);
    }
    const beats = document.createElement('div');
    beats.className = 'beats';
    (outline.beats || []).forEach((beat, index) => {
      const item = document.createElement('div');
      item.className = 'beat';
      const number = document.createElement('div');
      number.className = 'beat-index';
      number.textContent = `BEAT ${beat.order || index + 1}`;
      const heading = document.createElement('h4');
      heading.textContent = beat.title || `情节 ${index + 1}`;
      const summary = document.createElement('p');
      summary.textContent = beat.summary || beat.emotional_change || '';
      item.append(number, heading, summary);
      beats.appendChild(item);
    });
    content.appendChild(beats);

    const feedback = document.createElement('textarea');
    feedback.className = 'feedback-input';
    feedback.placeholder = '需要修改时，写下你的意见';
    feedback.style.marginTop = '13px';
    content.appendChild(feedback);

    const actions = document.createElement('div');
    actions.className = 'panel-actions';
    const confirm = button('确认并生成', 'play', true);
    const modify = button('修改大纲', 'pencil');
    actions.append(confirm, modify);
    content.appendChild(actions);

    confirm.addEventListener('click', () => {
      confirm.disabled = true; modify.disabled = true; feedback.disabled = true;
      streamRequest(sessionBody('confirm_outline'));
    });
    modify.addEventListener('click', () => {
      const value = feedback.value.trim();
      if (!value) return showToast('请先填写修改意见');
      confirm.disabled = true; modify.disabled = true; feedback.disabled = true;
      appendMessage('user', value);
      streamRequest(sessionBody('modify_outline', { feedback: value }));
    });
    appendMessage('assistant', content);
  }

  function startNovel(payload) {
    setBusy(true, `${payload.model || '模型'} 生成中`);
    state.novelText = '';
    const content = document.createElement('div');
    content.className = 'novel stream-caret';
    state.novelNode = content;
    appendMessage('assistant', content);
  }

  function appendNovel(delta) {
    if (!state.novelNode) startNovel({});
    state.novelText += delta;
    state.novelNode.textContent = state.novelText;
    scrollBottom();
  }

  function finishNovel(payload) {
    if (!state.novelNode) {
      state.novelText = payload.content || '';
      const content = document.createElement('div');
      content.className = 'novel';
      content.textContent = state.novelText;
      state.novelNode = content;
      appendMessage('assistant', content);
    } else {
      if (!state.novelText && payload.content) {
        state.novelText = payload.content;
        state.novelNode.textContent = state.novelText;
      }
      state.novelNode.classList.remove('stream-caret');
    }
    setBusy(false, payload.generated === false ? '已返回今日小说' : '生成完成');
    showToast(payload.generated === false ? '今天已有小说，已直接返回' : `生成完成，共 ${payload.character_count || state.novelText.length} 字`);
    pollMemoryAndGraph();
  }

  function renderApiError(payload) {
    setErrorStatus();
    const panel = document.createElement('div');
    panel.textContent = payload.message || '请求失败';
    const body = appendMessage('assistant', panel);
    body.classList.add('error');
    if (payload.retryable && state.sessionId) {
      const actions = document.createElement('div');
      actions.className = 'panel-actions';
      const retry = button('使用当前会话重试', 'refresh-cw', true);
      retry.addEventListener('click', () => {
        retry.disabled = true;
        streamRequest(sessionBody(payload.code === 'NOVEL_GENERATION_FAILED' ? 'retry_generation' : 'retry'));
      });
      body.appendChild(actions);
      actions.appendChild(retry);
      refreshIcons();
    }
  }

  function appendError(message) {
    const content = document.createElement('div');
    content.textContent = message;
    const body = appendMessage('assistant', content);
    body.classList.add('error');
  }

  function button(label, icon, primary = false) {
    const element = document.createElement('button');
    element.type = 'submit';
    element.className = `btn${primary ? ' primary' : ''}`;
    element.innerHTML = `<i data-lucide="${icon}"></i><span>${label}</span>`;
    return element;
  }

  function sessionBody(action, payload) {
    return {
      session_id: state.sessionId,
      user_id: state.userId,
      message_id: `web_${Date.now().toString(36)}`,
      action,
      payload: payload || null
    };
  }

  async function startSession() {
    const query = el.query.value.trim();
    if (!query || state.busy) return;
    const userId = el.userId.value.trim();
    if (!userId) return showToast('用户 ID 不能为空');
    state.userId = userId;
    localStorage.setItem('novel_debug_user_id', state.userId);
    state.prompts[state.activePrompt] = el.prompt.value;
    appendMessage('user', query);
    lockDebugConfig();
    await streamRequest({
      user_id: state.userId,
      message_id: `web_${Date.now().toString(36)}`,
      query,
      model: el.model.value.trim(),
      temperature: Number(el.tempNumber.value),
      prompt_overrides: state.prompts,
      force_regenerate: el.force.checked
    });
  }

  el.send.addEventListener('click', startSession);
  el.query.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); startSession(); }
  });
  el.query.addEventListener('input', () => {
    el.query.style.height = 'auto';
    el.query.style.height = `${Math.min(150, el.query.scrollHeight)}px`;
  });
  el.tempRange.addEventListener('input', () => setTemperature(el.tempRange.value));
  el.tempNumber.addEventListener('change', () => setTemperature(el.tempNumber.value));
  el.prompt.addEventListener('input', () => { state.prompts[state.activePrompt] = el.prompt.value; });
  $('resetPrompt').addEventListener('click', () => {
    state.prompts[state.activePrompt] = state.defaults[state.activePrompt] || '';
    el.prompt.value = state.prompts[state.activePrompt];
    showToast('已恢复默认提示词');
  });
  $('saveDefaults').addEventListener('click', saveSystemDefaults);
  $('newSession').addEventListener('click', resetSession);
  $('copySession').addEventListener('click', async () => {
    if (!state.sessionId) return showToast('还没有会话 ID');
    await navigator.clipboard.writeText(state.sessionId);
    showToast('会话 ID 已复制');
  });
  $('openSettings').addEventListener('click', () => el.settings.classList.add('open'));
  $('closeSettings').addEventListener('click', () => el.settings.classList.remove('open'));
  $('configViewTab').addEventListener('click', () => switchSettingsView('config'));
  $('graphViewTab').addEventListener('click', () => switchSettingsView('graph'));
  $('refreshGraph').addEventListener('click', loadGraph);
  $('addGraphNode').addEventListener('click', () => openNodeEditor());
  $('addGraphEdge').addEventListener('click', () => openEdgeEditor());
  el.graphNodePicker.addEventListener('change', editSelectedGraphNode);
  el.graphEdgePicker.addEventListener('change', editSelectedGraphEdge);
  $('clearGraph').addEventListener('click', clearUserGraph);
  $('closeGraphEditor').addEventListener('click', closeGraphEditor);
  $('cancelGraphEditor').addEventListener('click', closeGraphEditor);
  el.graphForm.addEventListener('submit', saveGraphEditor);
  el.userId.addEventListener('change', loadGraph);
  el.apiToken.addEventListener('change', connectDebug);
  $('connectToken').addEventListener('click', connectDebug);

  refreshIcons();
  loadConfig();
  el.query.focus();
</script>
</body>
</html>
